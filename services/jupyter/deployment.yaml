apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: jupyter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      securityContext:
        fsGroup: 100
      containers:
      - name: jupyter
        image: quay.io/jupyter/base-notebook:python-3.11.8
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: app-env
        env:
        - name: JUPYTER_PORT
          value: "8888"
        ports:
        - containerPort: 8888
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: workdir
          mountPath: /home/jovyan/work
      volumes:
      - name: workdir
        persistentVolumeClaim:
          claimName: jupyter-pvc
